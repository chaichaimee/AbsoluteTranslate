summary = "AbsoluteTranslate"
description = """Absolute Translate هو ملحق ترجمة متقدم مصمم لمستخدمي قارئ الشاشة NVDA. يوفر ترجمة سريعة ودقيقة باستخدام محركي Google Translate و Google AI Studio Gemini. تتضمن الميزات الرئيسية الترجمة الفورية للنص المحدد، التقاط سجل النطق، الترجمة المستمرة متعددة الأجزاء للمستندات الطويلة، تبديل اللغة التلقائي، أنماط الترجمة المخصصة مثل الرسمي، الودي، الأدبي، وكاتب الإعلانات، والتكامل المباشر مع الحافظة. إنه يعزز إمكانية الوصول والإنتاجية من خلال تقديم ترجمات موثوقة مع التخزين المؤقت ودعم التكوين الكامل.
اختصارات لوحة المفاتيح:"""