summary = "AbsoluteTranslate"
description = """Absolute Translate は、NVDA スクリーン リーダー ユーザー向けに設計された高度な翻訳アドオンです。Google Translate および Google AI Studio Gemini エンジンを使用して、高速で正確な翻訳を提供します。主な機能には、選択したテキストの即時翻訳、音声履歴の取得、長文書の連続マルチチャンク翻訳、自動言語切り替え、フォーマル、フレンドリー、文学的、コピーライターなどのカスタム翻訳スタイル、およびクリップボードとの直接統合が含まれます。キャッシングと完全な構成サポートを備えた信頼性の高い翻訳を提供することで、アクセシビリティと生産性を向上させます。
