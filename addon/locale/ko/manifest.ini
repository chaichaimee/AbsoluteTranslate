summary = "AbsoluteTranslate"
description = """Absolute Translate는 NVDA 스크린 리더 사용자를 위해 설계된 고급 번역 애드온입니다. Google Translate 및 Google AI Studio Gemini 엔진을 사용하여 빠르고 정확한 번역을 제공합니다. 주요 기능으로는 선택한 텍스트의 즉시 번역, 음성 기록 캡처, 긴 문서에 대한 연속 다중 청크 번역, 자동 언어 전환, 격식 있는, 친근한, 문학적, 카피라이터와 같은 맞춤형 번역 스타일, 클립보드 직접 통합이 포함됩니다. 캐싱 및 전체 구성 지원을 통해 신뢰할 수 있는 번역을 제공하여 접근성과 생산성을 향상시킵니다.
