summary = "AbsoluteTranslate"
description = """Absolute Translate è un componente aggiuntivo di traduzione avanzato progettato per gli utenti dello screen reader NVDA. Fornisce traduzioni rapide e accurate utilizzando i motori Google Translate e Google AI Studio Gemini. Le caratteristiche principali includono la traduzione istantanea del testo selezionato, la cattura della cronologia vocale, la traduzione continua multi-blocco per documenti lunghi, il cambio automatico della lingua, stili di traduzione personalizzati come formale, amichevole, letterario e copywriter, e l'integrazione diretta con gli appunti. Migliora l'accessibilità e la produttività offrendo traduzioni affidabili con caching e pieno supporto alla configurazione.
Scorciatoie da tastiera:"""