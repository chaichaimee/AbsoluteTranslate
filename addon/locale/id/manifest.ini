summary = "AbsoluteTranslate"
description = """Absolute Translate adalah add-on terjemahan tingkat lanjut yang dirancang untuk pengguna pembaca layar NVDA. Ini menyediakan terjemahan yang cepat dan akurat menggunakan mesin Google Translate dan Google AI Studio Gemini. Fitur utama meliputi terjemahan instan dari teks yang dipilih, penangkapan riwayat ucapan, terjemahan multi-bagian berkelanjutan untuk dokumen panjang, pertukaran bahasa otomatis, gaya terjemahan kustom seperti formal, ramah, sastra, dan copywriter, serta integrasi clipboard langsung. Ini meningkatkan aksesibilitas dan produktivitas dengan memberikan terjemahan yang andal dengan caching dan dukungan konfigurasi penuh.
Tombol Pintas:"""