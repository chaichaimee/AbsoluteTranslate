summary = "AbsoluteTranslate"
description = """Absolute Translate es un complemento de traducción avanzado diseñado para usuarios del lector de pantalla NVDA. Proporciona traducciones rápidas y precisas utilizando los motores de Google Translate y Google AI Studio Gemini. Las características clave incluyen la traducción instantánea de texto seleccionado, la captura del historial de voz, la traducción continua de múltiples fragmentos para documentos largos, el cambio automático de idioma, estilos de traducción personalizados como formal, amigable, literario y publicitario, y la integración directa con el portapapeles. Mejora la accesibilidad y la productividad al ofrecer traducciones confiables con almacenamiento en caché y soporte de configuración completo.
Atajos de teclado:"""