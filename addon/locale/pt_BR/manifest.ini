summary = "AbsoluteTranslate"
description = """Absolute Translate é um complemento de tradução avançado projetado para usuários do leitor de tela NVDA. Ele fornece tradução rápida e precisa usando os mecanismos do Google Translate e do Google AI Studio Gemini. Os principais recursos incluem tradução instantânea de texto selecionado, captura de histórico de fala, tradução contínua de vários blocos para documentos longos, troca automática de idioma, estilos de tradução personalizados como formal, amigável, literário e publicitário, e integração direta com a área de transferência. Ele melhora a acessibilidade e a produtividade, oferecendo traduções confiáveis com cache e suporte completo à configuração.
Teclas de Atalho:"""