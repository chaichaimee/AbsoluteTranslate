summary = "AbsoluteTranslate"
description = """Absolute Translate est un module complémentaire de traduction avancé conçu pour les utilisateurs du lecteur d'écran NVDA. Il fournit une traduction rapide et précise utilisant les moteurs Google Translate et Google AI Studio Gemini. Les principales fonctionnalités incluent la traduction instantanée du texte sélectionné, la capture de l'historique vocal, la traduction continue en plusieurs blocs pour les documents longs, le changement automatique de langue, des styles de traduction personnalisés tels que formel, amical, littéraire et publicitaire, ainsi que l'intégration directe avec le presse-papiers. Il améliore l'accessibilité et la productivité en fournissant des traductions fiables avec mise en cache et prise en charge complète de la configuration.
Raccourcis clavier :"""