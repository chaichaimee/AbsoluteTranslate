description = """Absolute Translate — это продвинутое дополнение для перевода, разработанное для пользователей программы чтения с экрана NVDA. Оно обеспечивает быстрый и точный перевод с использованием движков Google Translate и Google AI Studio Gemini. Основные функции включают мгновенный перевод выделенного текста, захват истории речи, непрерывный многофрагментный перевод длинных документов, автоматическое переключение языков, настраиваемые стили перевода (официальный, дружеский, литературный, рекламный) и прямую интеграцию с буфером обмена. Дополнение повышает доступность и продуктивность за счет надежного перевода с кэшированием и полной поддержкой конфигурации.
