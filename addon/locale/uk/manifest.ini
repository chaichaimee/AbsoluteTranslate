summary = "AbsoluteTranslate"
description = """Absolute Translate — це розширене доповнення для перекладу, розроблене для користувачів програми читання з екрана NVDA. Воно забезпечує швидкий і точний переклад за допомогою рушіїв Google Translate та Google AI Studio Gemini. Основні функції включають миттєвий переклад виділеного тексту, захоплення історії мовлення, безперервний багатофрагментний переклад довгих документів, автоматичне перемикання мов, налаштовувані стилі перекладу (офіційний, дружній, літературний, копірайтера) та пряму інтеграцію з буфером обміну. Доповнення покращує доступність і продуктивність завдяки надійному перекладу з кешуванням та повною підтримкою конфігурації.
