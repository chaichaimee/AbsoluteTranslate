summary = "AbsoluteTranslate"
description = """Absolute Translate ist ein erweitertes Übersetzungs-Add-on für Benutzer des NVDA-Bildschirmleseprogramms. Es bietet eine schnelle und genaue Übersetzung mit den Engines Google Translate und Google AI Studio Gemini. Zu den Hauptfunktionen gehören die sofortige Übersetzung von ausgewähltem Text, die Erfassung des Sprachverlaufs, die kontinuierliche Mehrblock-Übersetzung für lange Dokumente, der automatische Sprachwechsel, benutzerdefinierte Übersetzungsstile wie formal, freundlich, literarisch und Texter sowie die direkte Zwischenablageintegration. Es verbessert die Barrierefreiheit und Produktivität durch zuverlässige Übersetzungen mit Zwischenspeicherung und vollständiger Konfigurationsunterstützung.
Tastenkombinationen:"""