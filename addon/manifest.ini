description = """Absolute Translate is an advanced translation add-on designed for NVDA screen reader users. It provides fast and accurate translation using Google Translate and Google AI Studio Gemini engines. Key features include instant translation of selected text, speech history capture, continuous multi-chunk translation for long documents, auto-language swapping, custom translation styles like formal, friendly, literary, and copywriter, and direct clipboard integration. It enhances accessibility and productivity by delivering reliable translations with caching and full configuration support.
Hot Keys:
"""
